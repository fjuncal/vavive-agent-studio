spring:
  application:
    name: vavive-gptmaker-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vavive_gptmaker}
    username: ${DATABASE_USERNAME:vavive}
    password: ${DATABASE_PASSWORD:vavive}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Sao_Paulo

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:vavive-dev-secret-change-me-with-at-least-32-chars}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  cors:
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  features:
    real-channels-enabled: ${APP_FEATURE_REAL_CHANNELS_ENABLED:true}
    live-inbox-enabled: ${APP_FEATURE_LIVE_INBOX_ENABLED:true}
    sales-handoff-enabled: ${APP_FEATURE_SALES_HANDOFF_ENABLED:true}

gptmaker:
  base-url: ${GPTMAKER_BASE_URL:https://api.gptmaker.ai}
  api-token: ${GPTMAKER_API_TOKEN:}
  mock-enabled: ${GPTMAKER_MOCK_ENABLED:false}
